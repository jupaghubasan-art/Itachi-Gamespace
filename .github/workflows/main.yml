
name: Build SanjuSystemX APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SanjuSystemX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Files in repository:"
          ls -la

          WRAPPER=$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found in repository."
            echo "Upload the complete Android project, including Gradle Wrapper files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
